# =============================================================================
# rv32-ooo toolchain.lock
# Tool pins originated at G1 — 2026-08-15; dependency profile updated 2026-10-16.
#
# Local EDA tools run through Docker; CI uses the same Ubuntu 22.04 tool versions.
# Host Make/Bash/Git orchestrate the containers; EDA binaries stay in Docker.
# Container dependency profile simplified 2026-10-16; EDA versions unchanged.
# =============================================================================

# ── Simulation / Verification Container (rv32ooo-sim) ───────────────────────
[sim]
docker_image         = rv32ooo-sim:g1
base_image           = ubuntu:22.04

verilator_tag        = v4.038
verilator_source     = https://github.com/verilator/verilator.git
verilator_sha1       = 0cd4a57ad  # sha1 reported by binary, ref v4.038

spike_tag            = v1.1.0
spike_source         = https://github.com/riscv-software-src/riscv-isa-sim.git

riscv_gcc_release    = 2026.07.15
riscv_gcc_source     = https://github.com/riscv-collab/riscv-gnu-toolchain
riscv_gcc_artifact   = riscv32-elf-ubuntu-22.04-gcc.tar.xz
riscv_gcc_arch       = rv32imf
riscv_gcc_abi        = ilp32

python_version       = 3.10   # ubuntu 22.04 system
# Project runners use only Python's standard library.

# ── Synthesis Container (rv32ooo-syn) ────────────────────────────────────────
[syn]
docker_image         = rv32ooo-syn:g1
base_image           = ubuntu:22.04

yosys_tag            = yosys-0.9
yosys_source         = https://github.com/YosysHQ/yosys.git
yosys_sha1           = 1979e0b
sv2v_tag             = v0.0.12
sv2v_source          = https://github.com/zachjs/sv2v

# ── Optional architectural tests / physical design ───────────────────────────
[act4]
framework_commit    = 74efcaac81f48f437f58868771daf2ed2776d422
sail_version        = 0.13.1
# Requires a separate prepared ACT_IMAGE with Sail and mise or uv + Ruby/Bundler.
# Python/Ruby dependencies are pinned by the ACT4 framework, not the sim image.

[physical]
toolchain_lock      = physical/asap7/toolchain.lock
# OpenROAD/ORFS/ASAP7 are separate from the generic synthesis image.

# ── Historical G1 metadata (not the current project plan/status) ─────────────
[meta]
lock_date        = 2026-08-15
plan_version     = v1.2
stage            = G1
author           = rv32ooo-project
build_host_os    = ubuntu (docker daemon)
