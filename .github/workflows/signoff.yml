# =============================================================================
# signoff.yml — RV32 Out-of-Order Core CI / Signoff Workflow
# Repository : https://github.com/jimmy01081122/rv32_000
# Runner     : ubuntu-22.04 (GitHub-hosted)
#
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
#  lint            Verilator --lint-only (fast syntax + semantic check)
#  spike-diff      Spike comparison of the current directed ELF set
#  act4            ACT4 fresh generation and DUT execution (non-F profile)
#  coremark-smoke  CoreMark 5-run cycle-exact determinism check
#  synthesis       sv2v → Yosys (0 latches, 0 loops gate)
# =============================================================================

name: Signoff CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref to avoid wasting runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Shared environment ──────────────────────────────────────────────────────
env:
  # riscv-collab toolchain (riscv32-unknown-elf prefix, supports rv32imf_zicsr)
  RISCV_COLLAB_VER: "2026.07.15"
  RISCV_COLLAB_DIR: "/opt/riscv32-gcc"
  # Spike tag
  SPIKE_TAG: "v1.1.0"
  # sv2v version
  SV2V_VER: "v0.0.12"
  # Sail RISC-V binary release
  SAIL_RISCV_VER: "0.13.1"

# =============================================================================
# JOBS
# =============================================================================

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. LINT — Verilator --lint-only
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: "lint · Verilator lint-only"
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator

      - name: Verilator version
        run: verilator --version

      - name: Run lint
        run: |
          verilator --lint-only \
            -Wall \
            -Wno-UNUSED -Wno-STMTDLY \
            -f sim/scripts/rv32_ooo_core.f \
            --top-module rv32_ooo_core
          echo "✓ lint PASSED"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. SPIKE-DIFF — Spike lockstep differential verification
  # ───────────────────────────────────────────────────────────────────────────
  spike-diff:
    name: "spike-diff · Directed trace comparison"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      # ── apt-level deps ──────────────────────────────────────────────────────
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            verilator \
            build-essential cmake \
            libboost-regex-dev libboost-system-dev device-tree-compiler \
            python3 python3-pip \
            wget xz-utils

      # ── riscv32-unknown-elf GCC (riscv-collab pre-built) ────────────────────
      - name: Cache RISC-V GCC toolchain
        id: cache-riscv-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.RISCV_COLLAB_DIR }}
          key: riscv32-gcc-${{ env.RISCV_COLLAB_VER }}-ubuntu22

      - name: Download riscv32-unknown-elf GCC
        if: steps.cache-riscv-gcc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TARBALL="riscv32-elf-ubuntu-22.04-gcc.tar.xz"
          wget -q --show-progress \
            "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${RISCV_COLLAB_VER}/${TARBALL}" \
            -O /tmp/riscv32-gcc.tar.xz
          sudo mkdir -p "${RISCV_COLLAB_DIR}"
          sudo tar -xf /tmp/riscv32-gcc.tar.xz -C "${RISCV_COLLAB_DIR}" --strip-components=1
          rm -f /tmp/riscv32-gcc.tar.xz

      - name: Add riscv32 GCC to PATH
        run: echo "${RISCV_COLLAB_DIR}/bin" >> "$GITHUB_PATH"

      - name: Verify GCC
        run: riscv32-unknown-elf-gcc --version

      # ── Spike (build from source, cached) ───────────────────────────────────
      - name: Cache Spike binary
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: /opt/spike
          key: spike-${{ env.SPIKE_TAG }}-ubuntu22

      - name: Build Spike from source
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SPIKE_TAG}" \
            https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          mkdir build && cd build
          ../configure --prefix=/opt/spike --enable-commitlog
          make -j$(nproc)
          sudo make install

      - name: Add Spike to PATH
        run: echo "/opt/spike/bin" >> "$GITHUB_PATH"

      - name: Verify Spike
        run: spike --version 2>&1 || spike -h 2>&1 | head -2 || true

      # ── Python deps ──────────────────────────────────────────────────────────
      - name: Install Python packages
        run: |
          pip3 install --quiet \
            pyelftools==0.31 \
            pyyaml \
            tabulate \
            rich

      # ── Build Verilator simulator ────────────────────────────────────────────
      - name: Cache Verilator build
        id: cache-sim
        uses: actions/cache@v4
        with:
          path: build/sim
          key: sim-${{ hashFiles('rtl/**/*.sv', 'sim/tb/*.cpp', 'sim/tb/*.h', 'sim/scripts/*.f', 'scripts/build_sim.sh') }}

      - name: Build rv32_ooo_sim
        if: steps.cache-sim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/sim
          bash scripts/build_sim.sh 2>&1 | tee build/sim/verilator_build.log
          echo "✓ rv32_ooo_sim built"

      - name: Verify simulator binary
        run: ./build/sim/rv32_ooo_sim --help 2>&1 || true

      # ── Compile directed tests ───────────────────────────────────────────────
      - name: Compile directed test ELFs
        run: |
          bash scripts/compile_tests.sh 2>&1 | tee build/compile_tests.log

      # ── Run Spike differential verification ─────────────────────────────────
      - name: Compare directed DUT and Spike traces
        run: |
          set -euo pipefail
          mkdir -p results
          python3 scripts/run_spike_diff.py --json \
            2>&1 | tee results/spike_diff.log
          echo "✓ spike-diff PASSED"

      - name: Upload spike-diff logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-diff-logs
          path: |
            results/spike_diff.log
            build/tests/diff_results.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 3. ACT4 — pinned architectural tests (non-F profile, at least 58 ELFs)
  # ───────────────────────────────────────────────────────────────────────────
  act4:
    name: "act4 · ACT4 fresh ELF generation + DUT execution (58/58)"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      # Initialise the riscv-arch-test submodule manually to preserve
      # top-level checkout speed (other jobs don't need this).
      - name: Init riscv-arch-test submodule
        run: |
          git submodule update --init --depth 1 \
            verification/act4/riscv-arch-test

      # ── System packages ───────────────────────────────────────────────────────
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            verilator \
            build-essential \
            python3 python3-pip \
            wget xz-utils \
            libboost-regex-dev libboost-system-dev device-tree-compiler

      - name: Set up ACT4 Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.18"

      # ── riscv32-unknown-elf GCC ───────────────────────────────────────────────
      - name: Cache RISC-V GCC toolchain
        id: cache-riscv-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.RISCV_COLLAB_DIR }}
          key: riscv32-gcc-${{ env.RISCV_COLLAB_VER }}-ubuntu22

      - name: Download riscv32-unknown-elf GCC
        if: steps.cache-riscv-gcc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --show-progress \
            "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${RISCV_COLLAB_VER}/riscv32-elf-ubuntu-22.04-gcc.tar.xz" \
            -O /tmp/riscv32-gcc.tar.xz
          sudo mkdir -p "${RISCV_COLLAB_DIR}"
          sudo tar -xf /tmp/riscv32-gcc.tar.xz -C "${RISCV_COLLAB_DIR}" --strip-components=1
          rm -f /tmp/riscv32-gcc.tar.xz

      - name: Add riscv32 GCC to PATH
        run: echo "${RISCV_COLLAB_DIR}/bin" >> "$GITHUB_PATH"

      # ── sail_riscv_sim (pre-built static binary) ──────────────────────────────
      - name: Cache Sail RISC-V binary
        id: cache-sail
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/sail_riscv_sim
          key: sail-riscv-${{ env.SAIL_RISCV_VER }}-ubuntu22-verified-v2

      - name: Download / install sail_riscv_sim
        if: steps.cache-sail.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/riscv/sail-riscv/releases/download/${SAIL_RISCV_VER}/sail-riscv-Linux-x86_64.tar.gz" \
            -o /tmp/sail_riscv.tar.gz
          mkdir -p /tmp/sail-riscv
          tar -xzf /tmp/sail_riscv.tar.gz -C /tmp/sail-riscv
          SAIL_BIN=$(find /tmp/sail-riscv -type f -name sail_riscv_sim -print -quit)
          test -n "${SAIL_BIN}"
          sudo install -m 0755 "${SAIL_BIN}" /usr/local/bin/sail_riscv_sim

      - name: Verify Sail
        run: test "$(sail_riscv_sim --version)" = "${SAIL_RISCV_VER}"

      - name: Install ACT4 Python package manager
        run: pip3 install --quiet uv==0.11.33

      # ── Build DUT simulator ───────────────────────────────────────────────────
      - name: Cache Verilator build
        id: cache-sim
        uses: actions/cache@v4
        with:
          path: build/sim
          key: sim-${{ hashFiles('rtl/**/*.sv', 'sim/tb/*.cpp', 'sim/tb/*.h', 'sim/scripts/*.f', 'scripts/build_sim.sh') }}

      - name: Build rv32_ooo_sim
        if: steps.cache-sim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/sim
          bash scripts/build_sim.sh 2>&1 | tee build/sim/verilator_build.log

      # run_act4.py performs one fresh generation with real Sail before DUT execution.
      # ── Execute 58 ELFs on DUT ────────────────────────────────────────────────
      - name: Run ACT4 DUT execution (58/58)
        run: |
          set -euo pipefail
          python3 scripts/run_act4.py --json --out-dir verification/act4/report \
            2>&1 | tee results/act4_run.log

          # Gate: require all tests to pass
          python3 - << 'EOF'
          import json, sys
          d = json.load(open("verification/act4/report/act4_summary.json"))
          passed = d["passed_tests"]
          total  = d["total_tests"]
          print(f"ACT4 result: {passed}/{total} passed ({d['pass_rate_pct']}%)")
          if not d["all_passed"]:
              print("FAIL: Not all ACT4 tests passed!", file=sys.stderr)
              for t in d["results"]:
                  if not t["pass"]:
                      print(f"  FAIL: {t['test']} — {t['error']}", file=sys.stderr)
              sys.exit(1)
          print("✓ ACT4 PASSED (58/58)")
          EOF

      - name: Upload ACT4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act4-results
          path: |
            verification/act4/report/
            results/act4_run.log
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 4. COREMARK-SMOKE — 5-run determinism check
  # ───────────────────────────────────────────────────────────────────────────
  coremark-smoke:
    name: "coremark-smoke · 5-run cycle-exact determinism"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            verilator \
            build-essential \
            python3 python3-pip \
            wget xz-utils

      # ── riscv32-unknown-elf GCC ───────────────────────────────────────────────
      - name: Cache RISC-V GCC toolchain
        id: cache-riscv-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.RISCV_COLLAB_DIR }}
          key: riscv32-gcc-${{ env.RISCV_COLLAB_VER }}-ubuntu22

      - name: Download riscv32-unknown-elf GCC
        if: steps.cache-riscv-gcc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --show-progress \
            "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${RISCV_COLLAB_VER}/riscv32-elf-ubuntu-22.04-gcc.tar.xz" \
            -O /tmp/riscv32-gcc.tar.xz
          sudo mkdir -p "${RISCV_COLLAB_DIR}"
          sudo tar -xf /tmp/riscv32-gcc.tar.xz -C "${RISCV_COLLAB_DIR}" --strip-components=1
          rm -f /tmp/riscv32-gcc.tar.xz

      - name: Add riscv32 GCC to PATH
        run: echo "${RISCV_COLLAB_DIR}/bin" >> "$GITHUB_PATH"

      - name: Verify GCC
        run: riscv32-unknown-elf-gcc --version

      - name: Install Python packages
        run: pip3 install --quiet pyelftools pyyaml tabulate rich

      # ── Build DUT simulator ───────────────────────────────────────────────────
      - name: Cache Verilator build
        id: cache-sim
        uses: actions/cache@v4
        with:
          path: build/sim
          key: sim-${{ hashFiles('rtl/**/*.sv', 'sim/tb/*.cpp', 'sim/tb/*.h', 'sim/scripts/*.f', 'scripts/build_sim.sh') }}

      - name: Build rv32_ooo_sim
        if: steps.cache-sim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/sim
          bash scripts/build_sim.sh 2>&1 | tee build/sim/verilator_build.log

      # ── Compile CoreMark ──────────────────────────────────────────────────────
      - name: Compile CoreMark (3 iterations, PERFORMANCE_RUN, -O2)
        run: |
          bash scripts/compile_coremark.sh 3 PERFORMANCE_RUN -O2 \
            2>&1 | tee build/coremark_compile.log
          ls -lh build/coremark/

      # ── 5-run determinism check ───────────────────────────────────────────────
      - name: Run CoreMark 5-run determinism check
        run: |
          set -euo pipefail
          mkdir -p results/coremark

          python3 scripts/verify_coremark_reproducibility.py \
            --runs 5 \
            --iterations 3 \
            --opt="-O2" \
            --out-dir results/coremark \
            2>&1 | tee results/coremark/determinism.log

          python3 - << 'EOF'
          import json, sys
          d = json.load(open("results/coremark/coremark_reproducibility.json"))
          print(f"Deterministic        : {d['deterministic']}")
          print(f"Reference cycles     : {d['reference_sim_cycles']}")
          print(f"Reference retired    : {d['reference_retired_instructions']}")
          print(f"CoreMark/MHz         : {d.get('reference_coremark_mhz', 'N/A')}")
          if not d["deterministic"]:
              print("FAIL: CoreMark nondeterminism detected!", file=sys.stderr)
              sys.exit(1)
          print("✓ CoreMark determinism PASSED (5/5 runs identical)")
          EOF

      - name: Upload CoreMark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coremark-results
          path: |
            results/coremark/
            build/coremark_compile.log
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 5. SYNTHESIS — sv2v → Yosys (0 latches, 0 loops)
  # ───────────────────────────────────────────────────────────────────────────
  synthesis:
    name: "synthesis · Yosys (0 latches, 0 loops)"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            yosys \
            python3 python3-pip \
            wget unzip

      # ── sv2v (pre-built Haskell binary, ~6 MB) ────────────────────────────────
      - name: Cache sv2v binary
        id: cache-sv2v
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/sv2v
          key: sv2v-${{ env.SV2V_VER }}-ubuntu22

      - name: Download sv2v
        if: steps.cache-sv2v.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q \
            "https://github.com/zachjs/sv2v/releases/download/${SV2V_VER}/sv2v-Linux.zip" \
            -O /tmp/sv2v.zip
          unzip -q /tmp/sv2v.zip -d /tmp/sv2v-dist/
          sudo install -m 0755 /tmp/sv2v-dist/sv2v-Linux/sv2v /usr/local/bin/sv2v
          rm -rf /tmp/sv2v.zip /tmp/sv2v-dist

      - name: Verify Yosys + sv2v
        run: |
          yosys -V
          sv2v --version

      # ── Run synthesis flow ────────────────────────────────────────────────────
      - name: Run Yosys synthesis flow
        run: |
          set -euo pipefail
          bash syn/scripts/synth_yosys.sh 2>&1 | tee build/syn/synth_run.log

      # ── Parse and gate on 0 latches / 0 loops ────────────────────────────────
      - name: Check synthesis results (0 latches, 0 loops)
        run: |
          set -euo pipefail
          python3 scripts/parse_synth_log.py build/syn/synth.log \
            -o build/syn/synthesis_summary.json

          python3 - << 'EOF'
          import json, sys

          with open("build/syn/synthesis_summary.json") as f:
              data = json.load(f)

          # Support multiple key naming conventions from parse_synth_log.py
          latches = int(data.get("latch_count", data.get("latches", 0)) or 0)
          loops   = int(data.get("loop_count",  data.get("loops",   0)) or 0)
          errors  = int(data.get("check_errors", data.get("errors",  0)) or 0)

          print(f"Latches  : {latches}")
          print(f"Loops    : {loops}")
          print(f"Check err: {errors}")

          failed = False
          if latches != 0:
              print(f"FAIL: {latches} latches detected!", file=sys.stderr)
              failed = True
          if loops != 0:
              print(f"FAIL: {loops} combinational loops detected!", file=sys.stderr)
              failed = True
          if errors != 0:
              print(f"FAIL: {errors} check errors from Yosys!", file=sys.stderr)
              failed = True
          if failed:
              sys.exit(1)
          print("✓ Synthesis PASSED (0 latches, 0 loops, 0 errors)")
          EOF

      - name: Upload synthesis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-results
          path: |
            build/syn/synth.log
            build/syn/synth_run.log
            build/syn/rv32_ooo_core_netlist.v
            build/syn/synthesis_summary.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # SIGNOFF GATE — all 5 jobs must pass
  # ───────────────────────────────────────────────────────────────────────────
  signoff-gate:
    name: "✓ signoff · All checks passed"
    runs-on: ubuntu-22.04
    if: always()
    needs:
      - lint
      - spike-diff
      - act4
      - coremark-smoke
      - synthesis

    steps:
      - name: Check all job results
        run: |
          declare -A RESULTS
          RESULTS["lint"]="${{ needs.lint.result }}"
          RESULTS["spike-diff"]="${{ needs.spike-diff.result }}"
          RESULTS["act4"]="${{ needs.act4.result }}"
          RESULTS["coremark-smoke"]="${{ needs.coremark-smoke.result }}"
          RESULTS["synthesis"]="${{ needs.synthesis.result }}"

          FAIL=0
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  RV32 OoO Signoff Gate Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          for job in lint spike-diff act4 coremark-smoke synthesis; do
            status="${RESULTS[$job]}"
            if [ "${status}" = "success" ]; then
              echo "  ✓  ${job}"
            else
              echo "  ✗  ${job}  ← ${status}"
              FAIL=1
            fi
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${FAIL}" -eq 0 ]; then
            echo "  ALL SIGNOFF CHECKS PASSED"
          else
            echo "  SIGNOFF FAILED — see individual job logs"
            exit 1
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
